<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscreva-se | MARIBONE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #555;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 18px 0;
      font-size: 13px;
      color: #555;
    }

    .terms input {
      width: auto;
      margin-top: 2px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #222;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .login a {
      color: #222;
      font-weight: bold;
      text-decoration: none;
    }

    .login a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">MARIBONE</div>

    <p class="subtitle">
      Crie sua Conta Maribone
    </p>

    <form id="cadastroForm">

      <div class="form-group">
        <label for="nome">Nome</label>
        <input
          type="text"
          id="nome"
          name="nome"
          autocomplete="given-name"
          required
        >
      </div>

      <div class="form-group">
        <label for="sobrenome">Sobrenome</label>
        <input
          type="text"
          id="sobrenome"
          name="sobrenome"
          autocomplete="family-name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar senha</label>
        <input
          type="password"
          id="confirmarSenha"
          name="confirmarSenha"
          autocomplete="new-password"
          required
        >
      </div>

      <label class="terms">
        <input
          type="checkbox"
          id="termos"
          required
        >
        <span>
          Li e aceito os Termos de Uso e a Política de Privacidade.
        </span>
      </label>

      <button type="submit" id="botaoCadastro">
        CRIAR CONTA MARIBONE
      </button>

    </form>

    <div class="login">
      Já possui uma conta?
      <a href="https://www.maribone.com.br/login">
        Entrar
      </a>
    </div>

  </main>

  <script>

    const formulario =
      document.getElementById("cadastroForm");

    const botao =
      document.getElementById("botaoCadastro");

    formulario.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        console.log(
          "MARIBONE: formulário enviado."
        );

        const nome =
          document
            .getElementById("nome")
            .value
            .trim();

        const sobrenome =
          document
            .getElementById("sobrenome")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const senha =
          document
            .getElementById("senha")
            .value;

        const confirmarSenha =
          document
            .getElementById("confirmarSenha")
            .value;

        if (senha !== confirmarSenha) {

          alert(
            "As senhas não coincidem."
          );

          return;
        }

        if (senha.length < 8) {

          alert(
            "A senha deve possuir pelo menos 8 caracteres."
          );

          return;
        }

        botao.disabled = true;

        botao.textContent =
          "CRIANDO CONTA...";

        try {

          console.log(
            "MARIBONE: enviando cadastro para API..."
          );

          const resposta =
            await fetch(
              "https://api.maribone.com.br/auth/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    nome: nome,
                    sobrenome: sobrenome,
                    email: email,
                    senha: senha
                  })
              }
            );

          console.log(
            "MARIBONE: resposta recebida.",
            resposta.status
          );

          const resultado =
            await resposta.json();

          console.log(
            "MARIBONE: resultado:",
            resultado
          );

          if (resultado.success) {

            alert(
              "Conta Maribone criada com sucesso!"
            );

            formulario.reset();

          } else {

            alert(
              resultado.error ||
              "Não foi possível criar a conta."
            );
          }

        } catch (erro) {

          console.error(
            "MARIBONE: erro de conexão:",
            erro
          );

          alert(
            "Não foi possível conectar ao servidor.\n\n" +
            "Abra o F12 → Console para ver o diagnóstico."
          );

        } finally {

          botao.disabled = false;

          botao.textContent =
            "CRIAR CONTA MARIBONE";
        }

      }
    );

  </script>

</body>
</html>
